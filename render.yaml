services:
  - type: web
    name: essay-analyzer
    env: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
